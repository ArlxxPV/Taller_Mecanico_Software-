server:
  port: 8081

spring:
  application:
    name: tallerpro-backend

  # Carga las credenciales reales desde application-secrets.yml (ignorado por
  # git). Si ese archivo no existe todavia, "optional:" evita que el arranque
  # falle; copia application-secrets.yml.example y llena tus valores reales.
  config:
    import: "optional:application-secrets.yml"

  # --- Conexion al contenedor Docker tallerpro-mysql ---
  datasource:
    url: jdbc:mysql://localhost:3306/tallerpro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'validate': el esquema lo crea y versiona Flyway, no Hibernate.
      # Asi evitamos que JPA "adivine" columnas y se desincronice del historial de migraciones.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    # Placeholder: mientras no se configure un SMTP real, el "envio" de correos de
    # recuperacion de contrasena solo se registra en el log (ver ConsoleMailService).
    host: localhost
    port: 1025

# --- Configuracion propia de la app ---
tallerpro:
  jwt:
    # El valor real vive en application-secrets.yml (ignorado por git).
    expiracion-minutos: 30
  seguridad:
    max-intentos-fallidos: 5
    minutos-bloqueo: 15
  reset-password:
    minutos-expiracion: 30
    url-frontend: "http://localhost:5173/restablecer-password"

logging:
  level:
    com.tallerpro.backend: DEBUG
    org.hibernate.SQL: DEBUG
